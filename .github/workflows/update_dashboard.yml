name: Update KOSPI Dashboard

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard pipeline
        run: |
          mkdir -p output
          python main.py --no-browser

      - name: Copy dashboard to docs/
        run: |
          mkdir -p docs
          cp output/dashboard.html docs/index.html

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "chore: auto-update dashboard $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push
